<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuRF Harness</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64;
    --line: #e2e0d8; --accent: #2f5d8a; --accent-2: #c46a2b;
    --ok: #2e7d4f; --bad: #b3261e; --ok-bg: #e7f3ec; --bad-bg: #fbe9e7;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1c; --ink: #ecebe6; --muted: #9b9a93;
      --line: #33322e; --accent: #7fb0e0; --accent-2: #e59a5f;
      --ok: #7bc796; --bad: #f08b84; --ok-bg: #1d2e24; --bad-bg: #3a1f1d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -0.01em; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  section { background: var(--panel); border: 1px solid var(--line);
            border-radius: 10px; padding: 18px; margin-bottom: 18px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button, select { font: inherit; border-radius: 7px; padding: 7px 12px;
                   border: 1px solid var(--line); background: var(--panel);
                   color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent);
                   color: #fff; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button.primary { color: #10161c; } }
  button:disabled { opacity: .5; cursor: wait; }
  .status { color: var(--muted); font-size: 13px; }
  .summary { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line);
           white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }
  .pill { font-size: 12px; padding: 1px 8px; border-radius: 99px; font-weight: 600; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .ex { color: var(--muted); font-family: var(--mono); font-size: 12px; white-space: normal; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .chart h3 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: 500; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
  .empty { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>SuRF Harness</h1>
  <p class="sub">SuRF checked against an exact sorted-vector reference. False positives are measured; false negatives fail.</p>

  <section>
    <h2>Run</h2>
    <div class="controls">
      <button class="primary" id="run-correct">Run correctness suite</button>
      <span style="width:12px"></span>
      <select id="keys">
        <option value="10000">10K keys</option>
        <option value="100000" selected>100K keys</option>
        <option value="1000000">1M keys</option>
      </select>
      <select id="type">
        <option value="int">64-bit integer keys</option>
        <option value="string">email string keys</option>
      </select>
      <button class="primary" id="run-bench">Run benchmark</button>
      <span class="status" id="status"></span>
    </div>
  </section>

  <section>
    <h2>Correctness (latest run)</h2>
    <div id="correct"><p class="empty">No correctness run yet.</p></div>
  </section>

  <section>
    <h2>Benchmarks (latest run per key type and size)</h2>
    <div class="charts" id="charts"></div>
    <div class="wrap" id="bench"><p class="empty">No benchmark runs yet.</p></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (x, d = 1) => Number(x).toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: d });
const pct = (x) => (100 * x).toFixed(3) + "%";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const COLORS = { "SuRF-Base": "var(--accent)", "SuRF-Real8": "var(--accent-2)" };

function renderCorrectness(r) {
  if (!r) return;
  const groups = r.groups || [];
  let html = `<div class="summary">
    <div class="stat"><b>${r.total.toLocaleString()}</b><span>checks</span></div>
    <div class="stat"><b style="color:${r.failed ? "var(--bad)" : "var(--ok)"}">${r.failed.toLocaleString()}</b><span>failed</span></div>
    <div class="stat"><b>${new Date(r.started * 1000).toLocaleString()}</b><span>run at</span></div></div>
    <div class="wrap"><table><tr><th></th><th>Key set</th><th>Variant</th><th>Check</th><th style="text-align:right">Checks</th><th style="text-align:right">Failed</th><th>Examples</th></tr>`;
  for (const g of groups) {
    html += `<tr><td><span class="pill ${g.failed ? "bad" : "ok"}">${g.failed ? "FAIL" : "ok"}</span></td>
      <td>${esc(g.keyset)}</td><td>${esc(g.variant)}</td><td>${esc(g.category)}</td>
      <td class="num">${g.checks.toLocaleString()}</td><td class="num">${g.failed.toLocaleString()}</td>
      <td class="ex">${g.examples.map(esc).join("<br>")}</td></tr>`;
  }
  $("correct").innerHTML = html + "</table></div>";
}

function barChart(title, series, keyNames, valueOf, label) {
  // series: {variant: {keys: row}}
  const variants = Object.keys(series);
  const vals = [];
  for (const v of variants) for (const k of keyNames) if (series[v][k]) vals.push(valueOf(series[v][k]));
  const max = Math.max(...vals, 1e-9);
  const W = 320, H = 160, pad = 28, gw = (W - pad) / keyNames.length, bw = Math.min(26, gw / (variants.length + 1));
  let svg = `<svg viewBox="0 0 ${W} ${H + 20}" width="100%" role="img" aria-label="${esc(title)}">`;
  svg += `<line x1="${pad}" y1="${H}" x2="${W}" y2="${H}" stroke="var(--line)"/>`;
  keyNames.forEach((k, i) => {
    const gx = pad + i * gw + (gw - bw * variants.length) / 2;
    variants.forEach((v, j) => {
      const row = series[v][k];
      if (!row) return;
      const val = valueOf(row), h = (val / max) * (H - 14);
      svg += `<rect x="${gx + j * bw}" y="${H - h}" width="${bw - 3}" height="${h}" rx="2" fill="${COLORS[v] || "var(--muted)"}"><title>${esc(v)} ${esc(k)}: ${esc(label(val))}</title></rect>`;
    });
    svg += `<text x="${pad + i * gw + gw / 2}" y="${H + 15}" font-size="11" text-anchor="middle" fill="var(--muted)">${esc(k)}</text>`;
  });
  svg += `<text x="0" y="10" font-size="10" fill="var(--muted)">${esc(label(max))}</text></svg>`;
  const legend = variants.map((v) => `<span><span class="sw" style="background:${COLORS[v]}"></span>${esc(v)}</span>`).join("");
  return `<div class="chart"><h3>${esc(title)}</h3>${svg}<div class="legend">${legend}</div></div>`;
}

function renderBench(runs) {
  const latest = {};
  for (const r of runs) if (r.mode === "bench" && r.rows) for (const row of r.rows) latest[`${r.type}|${row.keys}|${row.variant}`] = { ...row, type: r.type };
  const rows = Object.values(latest).sort((a, b) => a.type.localeCompare(b.type) || a.keys - b.keys || a.variant.localeCompare(b.variant));
  if (!rows.length) return;
  let html = `<table><tr><th>Keys</th><th>Type</th><th>Variant</th><th style="text-align:right">Build ms</th><th style="text-align:right">Point ns</th><th style="text-align:right">Range ns</th><th style="text-align:right">Bits/key</th><th style="text-align:right">Point FPR</th><th style="text-align:right">Range FPR</th><th style="text-align:right">False neg.</th></tr>`;
  for (const r of rows) {
    const fn = r.point_fn + r.range_fn;
    html += `<tr><td class="num">${r.keys.toLocaleString()}</td><td>${esc(r.type)}</td><td>${esc(r.variant)}</td>
      <td class="num">${fmt(r.build_ms)}</td><td class="num">${fmt(r.point_ns)}</td><td class="num">${fmt(r.range_ns)}</td>
      <td class="num">${fmt(r.bits_per_key, 2)}</td><td class="num">${pct(r.point_fpr)}</td><td class="num">${pct(r.range_fpr)}</td>
      <td class="num"><span class="pill ${fn ? "bad" : "ok"}">${fn}</span></td></tr>`;
  }
  $("bench").innerHTML = html + "</table>";

  let charts = "";
  for (const type of ["int", "string"]) {
    const series = {}, keyNames = [];
    for (const r of rows.filter((r) => r.type === type)) {
      const k = r.keys >= 1e6 ? r.keys / 1e6 + "M" : r.keys / 1e3 + "K";
      if (!keyNames.includes(k)) keyNames.push(k);
      (series[r.variant] = series[r.variant] || {})[k] = r;
    }
    if (!keyNames.length) continue;
    charts += barChart(`Range FPR, ${type} keys`, series, keyNames, (r) => r.range_fpr, pct);
    charts += barChart(`Bits per key, ${type} keys`, series, keyNames, (r) => r.bits_per_key, (v) => fmt(v, 1));
  }
  $("charts").innerHTML = charts;
}

async function refresh() {
  const runs = await (await fetch("/api/results")).json();
  const corr = runs.filter((r) => r.mode === "correctness");
  renderCorrectness(corr[corr.length - 1]);
  renderBench(runs);
}

async function run(url, label) {
  for (const b of document.querySelectorAll("button")) b.disabled = true;
  $("status").textContent = `Running ${label}...`;
  try {
    const r = await (await fetch(url, { method: "POST" })).json();
    $("status").textContent = r.error ? `Error: ${r.error}` : `Done in ${r.seconds}s (saved results/${r.file})`;
    await refresh();
  } catch (e) {
    $("status").textContent = "Request failed: " + e;
  } finally {
    for (const b of document.querySelectorAll("button")) b.disabled = false;
  }
}

$("run-correct").onclick = () => run("/api/correctness", "correctness suite");
$("run-bench").onclick = () => run(`/api/bench?keys=${$("keys").value}&type=${$("type").value}`, "benchmark");
refresh();
</script>
</body>
</html>
